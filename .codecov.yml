codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "70...100"
  
  status:
    project:
      default:
        target: 46%  # Mantener cobertura actual
        threshold: 2%  # Permitir 2% de variación
        if_ci_failed: error
    
    patch:
      default:
        target: 60%  # Nuevo código debe tener ≥60% cobertura
        threshold: 10%
        if_ci_failed: error

comment:
  layout: "header, diff, files, footer"
  behavior: default
  require_changes: false
  require_base: no
  require_head: yes

ignore:
  - "tests/**/*"
  - "scripts/**/*"
  - "**/__pycache__/**/*"
  - "**/test_*.py"
  - "**/*_test.py"

