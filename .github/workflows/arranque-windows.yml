# Prueba de humo del arranque en un Windows real, sin publicar nada (BLD-020).
#
# Compila el exe con el mismo spec y el mismo script que el release, lo arranca
# en modo prueba (sin servidor: nunca con credenciales reales) y comprueba que
# llega a la ventana principal. Después instala con el instalador, como haría el
# usuario, y repite con el programa instalado. Los registros quedan como artefacto.
#
#   • A mano, desde la pestaña Actions.
#   • Solo, al subir una rama `diag/…`, para perseguir un fallo de arranque.
name: Arranque en Windows

on:
  workflow_dispatch:
  push:
    branches: ["diag/**"]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  arranque:
    name: Prueba de humo del exe
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt pyinstaller
      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compilar exe e instalador
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Arrancar el exe compilado (perfil nuevo)
        shell: pwsh
        run: ./scripts/prueba_arranque_windows.ps1 -Exe dist/GuardiasDePatio/GuardiasDePatio.exe -Modo ventana -Copia registros/1-compilado
      - name: Instalar como el usuario
        shell: pwsh
        run: |
          $instalador = Get-ChildItem Output -Filter "*-Windows-Setup.exe" | Select-Object -First 1
          $p = Start-Process -FilePath $instalador.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER" -PassThru -Wait
          Write-Host "Instalador: codigo $($p.ExitCode)"
          Get-ChildItem "$env:LOCALAPPDATA\Programs\Guardias de Patio" -Filter "*.exe"
      - name: Arrancar el programa instalado (segundo arranque)
        shell: pwsh
        run: ./scripts/prueba_arranque_windows.ps1 -Exe "$env:LOCALAPPDATA\Programs\Guardias de Patio\GuardiasDePatio.exe" -Modo ventana -Copia registros/2-instalado
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registros-arranque-windows
          path: registros/
          if-no-files-found: warn
