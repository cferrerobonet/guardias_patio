# Gate de calidad en cada push y pull request (SEC-007). Hasta v5.99.0 el único
# flujo se disparaba con etiquetas: un commit a main llegaba sin pasar nada.
#
#   • calidad: ruff, mypy sobre domain, bandit y pip-audit. Rápido.
#   • suite:   la suite completa sin pantalla, como en el flujo de compilación.
name: Comprobar

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  calidad:
    name: Lint, tipos y seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements-dev.txt
      # El largo de línea tiene su propio ratchet en `tests/audit/test_calidad_estatica.py`,
      # que sí baja con el tiempo. Aquí se gatea todo lo demás, que está limpio: así un
      # aviso nuevo de cualquier otra regla no llega a `main`.
      - name: ruff
        run: |
          ruff check src --ignore E501
          ruff check src --statistics || true
      - name: mypy (domain)
        working-directory: src
        run: mypy domain --no-error-summary
      - name: bandit
        run: bandit -r src -q -ll
      - name: pip-audit
        run: pip-audit --progress-spinner off

  suite:
    name: Suite de tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements-dev.txt
          sudo apt-get update
          # Bibliotecas del sistema que Qt necesita para arrancar sin pantalla.
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0
      - name: Ejecutar la suite
        env:
          QT_QPA_PLATFORM: offscreen
          GUARDIAS_API_SECRET_KEY: secreto-de-pruebas
        run: |
          pytest tests/ -q --no-cov -p no:cacheprovider -p no:timeout \
            --ignore=tests/test_benchmark_cpsat.py \
            --ignore=tests/e2e_playwright
