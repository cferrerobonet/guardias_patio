name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger en tags como v3.0.0, v3.1.0, etc.
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a liberar (ej: 3.0.1)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    name: Validar versión y código
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para changelog
      
      - name: Obtener versión
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="v${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📌 Versión: $VERSION"
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff mypy
      
      - name: Ejecutar tests
        run: |
          pytest tests/ --tb=short -v
      
      - name: Ejecutar linting
        run: |
          ruff check src/
      
      - name: Verificar versión en archivos
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          VERSION_NUM="${VERSION#v}"
          
          # Verificar pyproject.toml
          if ! grep -q "version = \"$VERSION_NUM\"" pyproject.toml; then
            echo "❌ Error: Versión en pyproject.toml no coincide"
            exit 1
          fi
          
          echo "✅ Versión verificada correctamente"

  build:
    name: Construir artefactos
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11']
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Construir ejecutable - Linux
        if: runner.os == 'Linux'
        run: |
          pyinstaller --clean --noconfirm "Guardias de Patio.spec"
          cd dist && tar -czf "guardias-patio-${{ needs.validate.outputs.version }}-linux.tar.gz" "Guardias de Patio"/
      
      - name: Construir ejecutable - macOS
        if: runner.os == 'macOS'
        run: |
          pyinstaller --clean --noconfirm "Guardias de Patio.spec"
          cd dist && zip -r "guardias-patio-${{ needs.validate.outputs.version }}-macos.zip" "Guardias de Patio.app"
      
      - name: Construir ejecutable - Windows
        if: runner.os == 'Windows'
        run: |
          pyinstaller --clean --noconfirm "GuardiasDePatio.spec"
          cd dist && Compress-Archive -Path "GuardiasDePatio" -DestinationPath "guardias-patio-${{ needs.validate.outputs.version }}-windows.zip"
      
      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: dist/guardias-patio-*
          retention-days: 90

  release:
    name: Crear release en GitHub
    needs: [validate, build]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Descargar todos los artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Generar changelog
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          
          # Obtener commits desde último tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          
          # Crear changelog
          cat > RELEASE_NOTES.md << EOF
          ## 🚀 Guardias de Patio ${VERSION}
          
          ### 📝 Cambios
          
          ${COMMITS}
          
          ### 📦 Instalación
          
          #### Linux
          \`\`\`bash
          tar -xzf guardias-patio-${VERSION}-linux.tar.gz
          cd "Guardias de Patio"
          ./GuardiasDePatio
          \`\`\`
          
          #### macOS
          \`\`\`bash
          unzip guardias-patio-${VERSION}-macos.zip
          open "Guardias de Patio.app"
          \`\`\`
          
          #### Windows
          1. Descomprimir \`guardias-patio-${VERSION}-windows.zip\`
          2. Ejecutar \`GuardiasDePatio.exe\`
          
          ### 📚 Documentación
          
          - [Guía de Usuario](https://github.com/${{ github.repository }}/blob/main/documentacion/USER_GUIDE.md)
          - [Guía Técnica](https://github.com/${{ github.repository }}/blob/main/documentacion/TECHNICAL_GUIDE.md)
          - [Changelog Completo](https://github.com/${{ github.repository }}/blob/main/documentacion/CHANGELOG.md)
          
          EOF
          
          cat RELEASE_NOTES.md
      
      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Release ${{ needs.validate.outputs.version }}"
          body_path: RELEASE_NOTES.md
          draft: true  # Crear como draft para revisión manual
          prerelease: ${{ contains(needs.validate.outputs.version, 'alpha') || contains(needs.validate.outputs.version, 'beta') || contains(needs.validate.outputs.version, 'rc') }}
          files: |
            artifacts/**/*
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Notificar éxito
        run: |
          echo "✅ Release ${{ needs.validate.outputs.version }} creado exitosamente"
          echo "🔍 Revisar en: ${{ github.server_url }}/${{ github.repository }}/releases"

