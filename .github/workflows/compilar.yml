# Compila la aplicación para Windows y macOS sin necesidad de tener un PC con
# Windows. El repositorio es público, así que los ordenadores de GitHub no
# cuestan nada ni tienen límite de minutos.
#
#   • Al publicar una etiqueta vX.Y.Z: compila las dos y las adjunta al release.
#   • A mano, desde la pestaña Actions: compila y deja los archivos para descargar.
name: Compilar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Adjuntar los instaladores al release de la última etiqueta"
        type: boolean
        default: false

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements-dev.txt
          sudo apt-get update
          # Bibliotecas del sistema que Qt necesita para arrancar sin pantalla.
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0
      - name: Ejecutar la suite
        env:
          QT_QPA_PLATFORM: offscreen
          GUARDIAS_API_SECRET_KEY: secreto-de-pruebas
        run: |
          pytest tests/ -q --no-cov -p no:cacheprovider -p no:timeout \
            --ignore=tests/test_benchmark_cpsat.py \
            --ignore=tests/e2e_playwright

  windows:
    name: Instalador de Windows
    needs: pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt pyinstaller
      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compilar exe e instalador
        # pwsh (PowerShell 7) lee los ficheros sin marca de orden como UTF-8;
        # el "powershell" clásico los leería como ANSI y rompería los acentos.
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Leer la versión
        id: version
        shell: bash
        run: |
          v=$(python -c "import sys; sys.path.insert(0,'src'); from config.settings import get_settings; print(get_settings().app_version)")
          echo "numero=$v" >> "$GITHUB_OUTPUT"
      - name: Comprobar que el ejecutable existe
        shell: bash
        run: test -f "dist/GuardiasDePatio/GuardiasDePatio.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: GuardiasDePatio-Windows
          path: Output/*.exe
          if-no-files-found: error

  macos:
    name: DMG de macOS
    needs: pruebas
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt pyinstaller
      - name: Compilar app y DMG
        # El script publica el release por su cuenta; aquí no, de eso se encarga
        # el paso final para adjuntar los dos instaladores a la vez.
        env:
          SKIP_RELEASE: "1"
        run: make dmg
      - uses: actions/upload-artifact@v4
        with:
          name: GuardiasPatio-macOS
          path: "*.dmg"
          if-no-files-found: error

  publicar:
    name: Adjuntar al release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          etiqueta="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            etiqueta=$(git describe --tags --abbrev=0)
          fi
          archivos=$(find instaladores -type f \( -name '*.dmg' -o -name '*.exe' \))
          echo "Adjuntando a $etiqueta:"; echo "$archivos"
          if gh release view "$etiqueta" >/dev/null 2>&1; then
            gh release upload "$etiqueta" $archivos --clobber
          else
            gh release create "$etiqueta" $archivos \
              --title "Guardias de Patio ${etiqueta#v}" --generate-notes
          fi
