name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'  # Semanal: lunes 2:00 AM (auditoría de dependencias)

jobs:
  test:
    name: Tests en Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Configurar Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Instalar dependencias del sistema (Qt) - Linux
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libxkbcommon-x11-0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-xinerama0 \
          libxcb-xfixes0 \
          libxcb-shape0 \
          libegl1 \
          libgl1-mesa-glx \
          x11-xserver-utils
    
    - name: Instalar dependencias de Python
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-qt pytest-mock ruff black mypy
    
    - name: Cache de paquetes PyQt
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Crear directorio de datos
      run: |
        mkdir -p data
    
    - name: Ejecutar tests con cobertura
      env:
        QT_QPA_PLATFORM: offscreen
        DISPLAY: ":99"
      run: |
        # Iniciar Xvfb solo en Linux
        if [ "$RUNNER_OS" == "Linux" ]; then
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          sleep 3
        fi
        
        pytest tests/ \
          --cov=src \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --junitxml=junit/test-results-${{ matrix.python-version }}-${{ matrix.os }}.xml \
          --tb=short \
          -v
    
    - name: Subir resultados de tests
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}-${{ matrix.os }}
        path: junit/test-results-${{ matrix.python-version }}-${{ matrix.os }}.xml
        retention-days: 30
    
    - name: Subir reporte de cobertura
      uses: actions/upload-artifact@v4
      if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
      with:
        name: coverage-report
        path: |
          coverage.xml
          htmlcov/
        retention-days: 30
    
    - name: Subir cobertura a Codecov
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-python-${{ matrix.python-version }}
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Linting y formato de código
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Instalar herramientas de linting
      run: |
        python -m pip install --upgrade pip
        pip install ruff black isort mypy
        pip install -r requirements.txt  # Necesario para mypy
    
    - name: Ejecutar Ruff (linter)
      run: |
        ruff check src/ tests/ --output-format=github
      continue-on-error: true
    
    - name: Ejecutar mypy (type checking)
      run: |
        echo "🔍 Ejecutando mypy con configuración progresiva..."
        echo ""
        echo "📊 Verificando módulos críticos (strict mode):"
        
        # Core modules - Alta prioridad (strict)
        echo "- Core: app_initializer, qt_imports"
        mypy src/core/app_initializer.py src/core/qt_imports.py --config-file=mypy.ini --show-error-codes || echo "❌ Errores en core"
        
        # Domain entities y repositories (strict)
        echo "- Domain: entities, repositories"
        mypy src/domain/entities/ src/domain/repositories/ --config-file=mypy.ini --show-error-codes || echo "❌ Errores en domain"
        
        # Use cases y repositories (strict)
        echo "- Application: use cases"
        mypy src/application/use_cases/ --config-file=mypy.ini --show-error-codes --no-error-summary || echo "⚠️ Algunos errores en use cases"
        
        echo "- Infrastructure: repositories"
        mypy src/infrastructure/repositories/ --config-file=mypy.ini --show-error-codes --no-error-summary || echo "⚠️ Algunos errores en repositories"
        
        echo ""
        echo "✅ Verificación de type hints completada"
      continue-on-error: true
    
    - name: Verificar formato con Black
      run: |
        black --check src/ tests/
      continue-on-error: true
    
    - name: Verificar imports con isort
      run: |
        isort --check-only src/ tests/
      continue-on-error: true

  security:
    name: Análisis de seguridad
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Instalar safety
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
    
    - name: Verificar vulnerabilidades en dependencias
      run: |
        pip install -r requirements.txt
        safety check --json || true
      continue-on-error: true
    
    - name: Análisis de seguridad con Bandit
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
      continue-on-error: true
    
    - name: Subir reporte de seguridad
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json

  build-summary:
    name: Resumen de construcción
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: always()
    
    steps:
    - name: Mostrar estado de jobs
      run: |
        echo "Estado de Tests: ${{ needs.test.result }}"
        echo "Estado de Linting: ${{ needs.lint.result }}"
        echo "Estado de Seguridad: ${{ needs.security.result }}"
    
    - name: Verificar éxito
      if: |
        needs.test.result == 'success' &&
        needs.lint.result == 'success' &&
        needs.security.result == 'success'
      run: |
        echo "✅ Todas las verificaciones pasaron correctamente"
        exit 0
    
    - name: Verificar fallos
      if: |
        needs.test.result != 'success' ||
        needs.lint.result != 'success' ||
        needs.security.result != 'success'
      run: |
        echo "❌ Algunas verificaciones fallaron"
        exit 1
