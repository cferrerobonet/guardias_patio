name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Tests en Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Configurar Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Instalar dependencias del sistema (Qt)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libxkbcommon-x11-0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-xinerama0 \
          libxcb-xfixes0 \
          libxcb-shape0 \
          libegl1 \
          libgl1-mesa-glx \
          x11-xserver-utils
    
    - name: Instalar dependencias de Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-qt pytest-mock ruff black
    
    - name: Crear directorio de datos
      run: |
        mkdir -p data
    
    - name: Ejecutar tests con cobertura
      env:
        QT_QPA_PLATFORM: offscreen
        DISPLAY: ":99"
      run: |
        Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        pytest tests/ \
          --cov=src \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --junitxml=junit/test-results-${{ matrix.python-version }}.xml \
          -v
    
    - name: Subir resultados de tests
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: junit/test-results-${{ matrix.python-version }}.xml
    
    - name: Subir reporte de cobertura
      uses: actions/upload-artifact@v4
      if: matrix.python-version == '3.11'
      with:
        name: coverage-report
        path: |
          coverage.xml
          htmlcov/
    
    - name: Subir cobertura a Codecov
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Linting y formato de código
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Instalar herramientas de linting
      run: |
        python -m pip install --upgrade pip
        pip install ruff black isort mypy
        pip install -r requirements.txt  # Necesario para mypy
    
    - name: Ejecutar Ruff (linter)
      run: |
        ruff check src/ tests/ --output-format=github
      continue-on-error: true
    
    - name: Ejecutar mypy (type checking)
      run: |
        mypy src/domain/schemas/ --show-error-codes --no-error-summary || true
        echo "---"
        mypy src/domain/entities/ --show-error-codes --no-error-summary || true
        echo "---"
        mypy src/domain/value_objects/ --show-error-codes --no-error-summary || true
      continue-on-error: true
    
    - name: Verificar formato con Black
      run: |
        black --check src/ tests/
      continue-on-error: true
    
    - name: Verificar imports con isort
      run: |
        isort --check-only src/ tests/
      continue-on-error: true

  security:
    name: Análisis de seguridad
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Instalar safety
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
    
    - name: Verificar vulnerabilidades en dependencias
      run: |
        pip install -r requirements.txt
        safety check --json || true
      continue-on-error: true
    
    - name: Análisis de seguridad con Bandit
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
      continue-on-error: true
    
    - name: Subir reporte de seguridad
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json

  build-summary:
    name: Resumen de construcción
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: always()
    
    steps:
    - name: Mostrar estado de jobs
      run: |
        echo "Estado de Tests: ${{ needs.test.result }}"
        echo "Estado de Linting: ${{ needs.lint.result }}"
        echo "Estado de Seguridad: ${{ needs.security.result }}"
    
    - name: Verificar éxito
      if: |
        needs.test.result == 'success' &&
        needs.lint.result == 'success' &&
        needs.security.result == 'success'
      run: |
        echo "✅ Todas las verificaciones pasaron correctamente"
        exit 0
    
    - name: Verificar fallos
      if: |
        needs.test.result != 'success' ||
        needs.lint.result != 'success' ||
        needs.security.result != 'success'
      run: |
        echo "❌ Algunas verificaciones fallaron"
        exit 1
