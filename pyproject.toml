[project]
name = "guardias-de-patio"
version = "5.98.0"
description = "Sistema de gestión de guardias de patio para centros educativos"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy",
    "alembic",
    "python-dateutil",
    "PyQt6==6.7.0",
    "PyQt6-Qt6==6.7.3",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=23.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.104.0",
    "PyJWT>=2.9.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "slowapi>=0.1.9",
    "openpyxl>=3.1.0",
    "uvicorn[standard]>=0.24.0",
    "paramiko>=4.0.0",
    "tenacity>=8.2.0",
    "cachetools>=5.3.0",
    "bcrypt>=4.0.0",
    "cryptography>=41.0.0",
    "matplotlib>=3.7.0",
    "reportlab>=4.0.0",
    "ortools>=9.7.0",
    "pybreaker>=1.0.0",
    "prometheus-client>=0.19.0",
    "psutil>=5.9.0",
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "coverage>=7.3.0",
    "mutmut>=2.4.4"
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
guardias-gui = "src.main:main"
guardias-api = "src.api.main:app"

[tool.ruff]
line-length = 100
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
# `select`/`ignore` en la raíz quedaron obsoletos: ruff avisaba en cada ejecución.
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# main.py inserta la raíz del proyecto en sys.path antes de importar nada suyo:
# esos imports no pueden ir arriba del todo.
"src/main.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

# Strict mode progresivo (Sprint Mini-A: Type Safety)
# Activamos reglas estrictas excepto para módulos legacy
strict = false  # No activamos strict global aún, sino reglas individuales

# Checks de tipos estrictos
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Activaremos módulo por módulo
disallow_incomplete_defs = true  # Forzar completar type hints
check_untyped_defs = true
disallow_untyped_decorators = false  # PyQt6 usa muchos decorators sin tipos
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Mejores prácticas
disallow_any_unimported = false  # Demasiado estricto
disallow_any_expr = false  # Demasiado estricto
disallow_any_decorated = false  # PyQt6 decorators
disallow_any_explicit = false  # A veces Any es necesario
disallow_any_generics = false  # Iremos activando gradualmente
disallow_subclassing_any = true

# SQLAlchemy y ORM considerations
disallow_untyped_calls = false  # SQLAlchemy tiene muchas calls sin tipos

# Módulos externos sin tipos
[[tool.mypy.overrides]]
module = [
    "PyQt6.*",
    "reportlab.*",
    "matplotlib.*",
    "openpyxl.*",
    "sqlalchemy.*",
]
ignore_missing_imports = true

# Módulos donde aplicaremos strict typing (Sprint Mini-A)
[[tool.mypy.overrides]]
module = "domain.entities.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "domain.value_objects.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "domain.services.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Legacy modules - relax rules temporalmente
[[tool.mypy.overrides]]
module = [
    "presentation.forms.*",
    "presentation.dialogs.*",
]
disallow_incomplete_defs = false
disallow_untyped_defs = false
