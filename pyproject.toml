[project]
name = "guardias-de-patio"
version = "5.99.0"
description = "Sistema de gestión de guardias de patio para centros educativos"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy==2.0.52",
    "alembic==1.19.2",
    "python-dateutil==2.9.0.post0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "structlog==26.1.0",
    "python-dotenv==1.2.3",
    "keyring==25.7.0",
    "PyQt6==6.7.0",
    "PyQt6-Qt6==6.7.3",
    "matplotlib==3.11.1",
    "reportlab==5.0.1",
    "openpyxl==3.1.5",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "PyJWT==2.13.0",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "slowapi==0.1.10",
    "paramiko==5.0.0",
    "tenacity==9.1.4",
    "cachetools==7.1.8",
    "pybreaker==1.4.1",
    "bcrypt==5.0.0",
    "cryptography==50.0.1",
    "ortools==9.15.6755",
    "dependency-injector==4.49.1",
    "prometheus-client==0.26.0",
    "psutil==7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "pytest-benchmark==5.3.0",
    "coverage==7.16.0",
    "hypothesis==6.167.1",
    "mutmut==3.7.0",
    "playwright==1.62.0",
    "pytest-playwright==0.9.0",
    "ruff==0.16.6",
    "mypy==2.3.1",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "radon==6.0.1",
    "vulture==2.16",
    "setuptools==84.0.0",
    "pyinstaller==6.22.2",
]

[build-system]
requires = ["setuptools>=83.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
guardias-gui = "src.main:main"
guardias-api = "src.api.main:app"

[tool.ruff]
line-length = 100
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
# `select`/`ignore` en la raíz quedaron obsoletos: ruff avisaba en cada ejecución.
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# main.py inserta la raíz del proyecto en sys.path antes de importar nada suyo:
# esos imports no pueden ir arriba del todo.
"src/main.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

# Strict mode progresivo (Sprint Mini-A: Type Safety)
# Activamos reglas estrictas excepto para módulos legacy
strict = false  # No activamos strict global aún, sino reglas individuales

# Checks de tipos estrictos
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Activaremos módulo por módulo
disallow_incomplete_defs = true  # Forzar completar type hints
check_untyped_defs = true
disallow_untyped_decorators = false  # PyQt6 usa muchos decorators sin tipos
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Mejores prácticas
disallow_any_unimported = false  # Demasiado estricto
disallow_any_expr = false  # Demasiado estricto
disallow_any_decorated = false  # PyQt6 decorators
disallow_any_explicit = false  # A veces Any es necesario
disallow_any_generics = false  # Iremos activando gradualmente
disallow_subclassing_any = true

# SQLAlchemy y ORM considerations
disallow_untyped_calls = false  # SQLAlchemy tiene muchas calls sin tipos

# Módulos externos sin tipos
[[tool.mypy.overrides]]
module = [
    "PyQt6.*",
    "reportlab.*",
    "matplotlib.*",
    "openpyxl.*",
    "sqlalchemy.*",
]
ignore_missing_imports = true

# Módulos donde aplicaremos strict typing (Sprint Mini-A)
[[tool.mypy.overrides]]
module = "domain.entities.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "domain.value_objects.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "domain.services.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Legacy modules - relax rules temporalmente
[[tool.mypy.overrides]]
module = [
    "presentation.forms.*",
    "presentation.dialogs.*",
]
disallow_incomplete_defs = false
disallow_untyped_defs = false
