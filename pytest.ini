# pytest configuration
[pytest]
# Directorio de tests
testpaths = tests

# Patrón de archivos de test
python_files = test_*.py

# Patrón de clases de test
python_classes = Test*

# Patrón de funciones de test
python_functions = test_*

# Opciones por defecto
# La cobertura NO va aquí: encarece cada ejecución y sólo hace falta al medirla.
# Usar `make coverage` (o añadir --cov=src a mano) cuando se quiera el informe.
addopts = 
    -v
    --strict-markers
    --tb=short

# Markers personalizados
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, multiple components)
    ui: UI tests (require Qt application)
    slow: Slow tests (>1s)
    db: Tests that require database
    multicurso: Tests for multi-course system
    benchmark: Performance benchmarks (run with make bench)
    audit: Suite de auditoría (tests/audit)
    modales_reales: El test necesita el comportamiento modal real (desactiva la guarda de diálogos)

# Configuración de Qt para pytest-qt
qt_api = pyqt6

# Timeout para tests (segundos). Requiere pytest-timeout (requirements-dev.txt).
timeout = 300

# Un xfail que pasa es un fallo: obliga a retirar la marca en cuanto se arregla
# el hallazgo, en vez de dejar marcas obsoletas acumulándose (QA-009).
xfail_strict = true

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
