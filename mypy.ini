[mypy]
# Configuración progresiva de mypy para el proyecto
# Aumentaremos la rigurosidad gradualmente

python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True

# Ignorar imports que no tienen stubs
ignore_missing_imports = True

# Configuración por módulo - Nivel 1 (más permisivo)
[mypy-src.utils.*]
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-src.presentation.*]
disallow_untyped_defs = False
check_untyped_defs = False

# Nivel 2 (moderado) - Core domain logic
[mypy-src.domain.entities.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-src.domain.repositories.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# Nivel 3 (estricto) - Use cases y repositories
[mypy-src.application.use_cases.*]
disallow_untyped_defs = True
warn_return_any = True

[mypy-src.infrastructure.repositories.*]
disallow_untyped_defs = True
warn_return_any = True

# Core modules - Alta prioridad
[mypy-src.core.exceptions]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-src.core.app_initializer]
disallow_untyped_defs = True
check_untyped_defs = True

# Nuevos módulos creados - Exigir type hints completos
[mypy-src.core.qt_imports]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-src.presentation.main_window]
disallow_untyped_defs = False
check_untyped_defs = True
